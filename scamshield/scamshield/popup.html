<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ScamShield</title>
<style>
  body { width: 340px; margin: 0; padding: 16px; font-family: system-ui, "Segoe UI", Arial, sans-serif; font-size: 15px; color: #111827; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  p.sub { margin: 0 0 14px; color: #4b5563; font-size: 14px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #9ca3af; border-radius: 6px; }
  textarea { height: 90px; resize: vertical; }
  button { margin-top: 8px; padding: 9px 14px; font: inherit; font-weight: 600; border: 0; border-radius: 6px; background: #1d4ed8; color: #fff; cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 1px; }
  .row { display: flex; align-items: center; gap: 10px; }
  #saved { color: #15803d; font-size: 14px; }
  hr { border: 0; border-top: 1px solid #e5e7eb; margin: 16px 0 6px; }
  #out { margin-top: 12px; }
  .verdict { color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 18px; font-weight: 700; }
  ul { margin: 4px 0; padding-left: 20px; }
  .note { color: #6b7280; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
  <h1>ScamShield</h1>
  <p class="sub">Check a suspicious message or link. You can also select text on any page, right-click and choose "Check with ScamShield".</p>

  <label for="key">Gemini API key</label>
  <input id="key" type="password" placeholder="Paste your key here" autocomplete="off">

  <label for="lang">Reply language</label>
  <select id="lang">
    <option value="English">English</option>
    <option value="Hindi">हिन्दी (Hindi)</option>
    <option value="Telugu">తెలుగు (Telugu)</option>
  </select>

  <div class="row"><button id="save">Save settings</button><span id="saved"></span></div>

  <hr>

  <label for="text">Paste a message or link</label>
  <textarea id="text" placeholder="Paste the message here"></textarea>
  <button id="check">Check now</button>

  <div id="out" aria-live="polite"></div>
  <script src="popup.js"></script>
</body>
</html>
